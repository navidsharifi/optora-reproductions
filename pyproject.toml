[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optora-reproductions"
version = "0.0.0"
description = "Reproductions of published distributionally robust optimization papers using Optora."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Optora contributors" }
]
# The released Optora wheel, pinned exactly so every recorded result names
# the library version it was measured with. Bump only together with a
# re-run of every reproduction (plan step 5c).
dependencies = [
  "optora==0.4.0",
  "torch>=2.2",
  # PyTorch wheels from the CUDA index do not pull NumPy, and torch warns
  # on import without it.
  "numpy>=1.26"
]

[project.urls]
Repository = "https://github.com/navidsharifi/optora-reproductions"
Optora = "https://github.com/navidsharifi/optora"
Documentation = "https://navidsharifi.github.io/optora/"

# Domain extras (vision, text, reference solvers, plotting) are added with
# the first paper that needs them, never ahead of time.
[project.optional-dependencies]
# Independent solvers that check reproductions (workflow step 6), on small
# instances or as the reference values of a claim. Never a source of a
# paper's own results.
reference = [
  "cvxpy>=1.5",
  "scipy>=1.11"
]
# Image models and datasets, first needed by sagawa2020_group_dro
# (ResNet-50 from torchvision, Waterbirds stored as Parquet). Install
# torchvision from the same PyTorch index as torch.
vision = [
  "torchvision>=0.17",
  "pyarrow>=15",
  "pillow>=10"
]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  # Test-only: validates the generated notebooks against the official
  # Jupyter schema in tests/tools/test_notebooks.py.
  "nbformat>=5.7"
]

# Only the shared helpers are a package. Papers, tools and tests run from
# the repository root through `python -m`.
[tool.setuptools.packages.find]
where = ["."]
include = ["optora_reproductions*"]

[tool.pytest.ini_options]
testpaths = ["tests", "papers"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["optora_reproductions", "tools", "papers"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Generated by tools/notebooks.py and checked by its --check; formatting it
# would make the check fail.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["optora_reproductions", "papers", "tools", "tests", "conftest.py"]
ignore_missing_imports = true
strict = true

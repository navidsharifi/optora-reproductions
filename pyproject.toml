[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optora-reproductions"
version = "0.0.0"
description = "Reproductions of published distributionally robust optimization papers using Optora."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Optora contributors" }
]
# The released Optora wheel, pinned exactly so every recorded result names
# the library version it was measured with. Bump only together with a
# re-run of every reproduction (plan step 5c).
dependencies = [
  "optora==0.2.0",
  "torch>=2.2",
  # PyTorch wheels from the CUDA index do not pull NumPy, and torch warns
  # on import without it.
  "numpy>=1.26"
]

[project.urls]
Repository = "https://github.com/navidsharifi/optora-reproductions"
Optora = "https://github.com/navidsharifi/optora"
Documentation = "https://navidsharifi.github.io/optora/"

# Domain extras (vision, text, reference solvers, plotting) are added with
# the first paper that needs them, never ahead of time.
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.5",
  "mypy>=1.10"
]

# Only the shared helpers are a package. Papers, tools and tests run from
# the repository root through `python -m`.
[tool.setuptools.packages.find]
where = ["."]
include = ["optora_reproductions*"]

[tool.pytest.ini_options]
testpaths = ["tests", "papers"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["optora_reproductions", "tools", "papers"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["optora_reproductions", "papers", "tools", "tests", "conftest.py"]
ignore_missing_imports = true
strict = true

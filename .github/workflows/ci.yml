name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_RETRIES: "10"

jobs:
  # Lint, types, every paper's smoke test on CPU, and the results table.
  # Full runs are local; their records are committed under results/.
  checks:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}
      - run: python -m pip install -e ".[dev,reference,vision]"
      - run: python -c "import optora, torch; print('optora', optora.__version__, 'torch', torch.__version__)"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov
      - run: python -m tools.results_table --check
      - run: python -m tools.notebooks --check
